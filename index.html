<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סידור עבודה — מכס יצוא</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D40511;
    --yellow: #FFCC00;
    --dark: #1a1a1a;
    --darker: #111;
    --gray: #2a2a2a;
    --gray2: #3a3a3a;
    --light: #f5f5f5;
    --text: #e8e8e8;
    --muted: #888;
    --border: #333;
    --success: #22c55e;
    --info: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--darker);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    background: var(--red);
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-logo svg { width: 52px; height: auto; }
  .topbar-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }
  .topbar-subtitle {
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    font-weight: 400;
  }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-yellow { background: var(--yellow); color: var(--dark); }
  .btn-yellow:hover { background: #ffd700; }
  .btn-ghost { background: rgba(255,255,255,0.15); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,0.25); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-info { background: var(--info); color: #fff; }

  /* ===== MAIN LAYOUT ===== */
  .main { padding: 20px; max-width: 1400px; margin: 0 auto; }

  /* ===== WEEK NAV ===== */
  .week-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    background: var(--gray);
    border-radius: 10px;
    padding: 12px 16px;
    border: 1px solid var(--border);
  }
  .week-nav button {
    background: var(--gray2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .week-nav button:hover { background: var(--red); border-color: var(--red); }
  .week-label {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    flex: 1;
    text-align: center;
  }
  .btn-today {
    background: var(--yellow);
    color: var(--dark);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-family: 'Heebo', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ===== SCHEDULE TABLE ===== */
  .table-wrap {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--gray);
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
  }
  thead tr {
    background: var(--dark);
    border-bottom: 2px solid var(--red);
  }
  thead th {
    padding: 12px 10px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    min-width: 130px;
  }
  thead th:first-child { text-align: right; min-width: 50px; }
  .th-date { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .th-today { color: var(--yellow) !important; }
  .th-today .th-date { color: rgba(255,204,0,0.7) !important; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td {
    padding: 8px 10px;
    vertical-align: middle;
    text-align: center;
  }
  tbody td:first-child {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    width: 50px;
  }

  /* ===== CELL ===== */
  .cell {
    background: var(--gray2);
    border-radius: 8px;
    padding: 7px 8px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
    position: relative;
  }
  .cell:hover { border-color: var(--red); background: #3f1a1a; }
  .cell.has-data { border-color: rgba(212,5,17,0.3); }
  .cell.is-vacation { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); }
  .cell.is-off { background: rgba(255,204,0,0.07); border-color: rgba(255,204,0,0.2); }
  .cell.is-today-col { border-right: 2px solid var(--yellow); }

  .cell-task {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
  }
  .cell-rep {
    font-size: 12px;
    color: var(--yellow);
    font-weight: 600;
  }
  .cell-hour {
    font-size: 11px;
    color: var(--muted);
  }
  .cell-empty {
    font-size: 11px;
    color: #555;
    margin: auto;
  }
  .vacation-badge {
    background: rgba(34,197,94,0.2);
    color: #22c55e;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
  }

  /* ===== ROW NUM ===== */
  .row-num {
    color: #555;
    font-size: 11px;
    padding: 0 6px;
  }

  /* ===== ADD ROW BUTTON ===== */
  .add-row-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 10px;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    transition: all 0.15s;
    border-radius: 0 0 10px 10px;
  }
  .add-row-btn:hover { background: rgba(212,5,17,0.08); color: var(--red); border-color: var(--red); }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--gray);
    border-radius: 14px;
    border: 1px solid var(--border);
    width: 100%;
    max-width: 420px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { transform: scale(0.95) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 18px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal h3 span { color: var(--yellow); }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    color: #fff;
    outline: none;
    transition: border 0.15s;
    direction: rtl;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--red);
  }
  .form-group select option { background: var(--dark); }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: flex-end;
  }
  .btn-cancel { background: var(--gray2); color: var(--text); }
  .btn-cancel:hover { background: var(--border); }

  /* ===== LOGIN ===== */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--darker);
    padding: 20px;
  }
  .login-box {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .login-box .dhl-logo { margin-bottom: 20px; }
  .login-box h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; color: #fff; }
  .login-box p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .login-box input {
    width: 100%;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-family: 'Heebo', sans-serif;
    font-size: 15px;
    color: #fff;
    text-align: center;
    outline: none;
    margin-bottom: 12px;
    direction: ltr;
    letter-spacing: 2px;
  }
  .login-box input:focus { border-color: var(--red); }
  .login-box .btn-yellow { width: 100%; padding: 12px; font-size: 15px; }
  .login-error { color: #f87171; font-size: 13px; margin-top: 8px; }

  /* ===== ADMIN PANEL ===== */
  .admin-bar {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .admin-bar-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-left: 4px;
  }

  /* ===== EMPLOYEE VIEW ===== */
  .emp-view {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .emp-view h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: #fff; }
  .emp-week-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .emp-day-card {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
  }
  .emp-day-card.today { border-color: var(--yellow); }
  .emp-day-name { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .emp-day-task { font-size: 12px; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 4px; }
  .emp-day-hour { font-size: 12px; color: var(--yellow); font-weight: 600; }
  .emp-day-off { font-size: 11px; color: #22c55e; font-weight: 700; }

  /* ===== EMPLOYEE LOGIN ===== */
  .emp-login { margin-top: 10px; }
  .mode-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--dark);
    color: var(--muted);
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-btn.active { background: var(--red); border-color: var(--red); color: #fff; }

  /* ===== STATS ROW ===== */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
  }
  .stat-num { font-size: 26px; font-weight: 900; color: var(--yellow); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 500; }

  /* ===== EMPLOYEES MANAGE ===== */
  .emp-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .emp-tag {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .emp-tag button {
    background: none;
    border: none;
    color: #f87171;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  /* ===== TASKS PRESET ===== */
  .task-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .task-chip {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.1s;
    color: var(--text);
  }
  .task-chip:hover { background: var(--red); border-color: var(--red); color: #fff; }

  .badge-red { background: rgba(212,5,17,0.2); color: #f87171; border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 700; }
  .badge-green { background: rgba(34,197,94,0.2); color: #22c55e; border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 700; }
  .badge-yellow { background: rgba(255,204,0,0.15); color: var(--yellow); border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 700; }

  /* ===== BACKUP ===== */
  .backup-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #222;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: #f87171; }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .main { padding: 12px; }
    .emp-week-grid { grid-template-columns: repeat(3, 1fr); }
    .topbar-title { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <div class="dhl-logo">
      <svg width="80" viewBox="0 0 100 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="30" rx="4" fill="#D40511"/>
        <text x="50" y="21" font-family="Arial Black" font-size="18" font-weight="900" fill="#FFCC00" text-anchor="middle">DHL</text>
      </svg>
    </div>
    <h2>מכס יצוא</h2>
    <p>סידור עבודה שבועי</p>
    <div class="mode-switch">
      <button class="mode-btn active" onclick="setLoginMode('admin')" id="modeAdminBtn">🔑 מנהל</button>
      <button class="mode-btn" onclick="setLoginMode('emp')" id="modeEmpBtn">👤 עובד</button>
    </div>
    <div id="adminLoginForm">
      <input type="password" id="adminPassInput" placeholder="סיסמת מנהל" onkeydown="if(event.key==='Enter')doLogin()"/>
      <button class="btn btn-yellow" onclick="doLogin()">כניסה</button>
    </div>
    <div id="empLoginForm" class="hidden">
      <input type="text" id="empNameInput" placeholder="שם עובד" list="empNamesList" style="direction:rtl;letter-spacing:0;margin-bottom:8px;text-align:right"/>
      <datalist id="empNamesList"></datalist>
      <input type="password" id="empPassInput" placeholder="מספר עובד (סיסמה)" onkeydown="if(event.key==='Enter')doEmpLogin()"/>
      <button class="btn btn-yellow" onclick="doEmpLogin()" style="margin-top:4px">כניסה</button>
    </div>
    <div id="loginError" class="login-error hidden"></div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app" class="hidden">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-logo">
      <svg width="52" viewBox="0 0 100 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="30" rx="3" fill="rgba(255,255,255,0.15)"/>
        <text x="50" y="21" font-family="Arial Black" font-size="18" font-weight="900" fill="#FFCC00" text-anchor="middle">DHL</text>
      </svg>
      <div>
        <div class="topbar-title">מכס יצוא</div>
        <div class="topbar-subtitle">סידור עבודה שבועי</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="userBadge" class="badge-yellow"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">יציאה</button>
    </div>
  </div>

  <div class="main">

    <!-- Employee View -->
    <div id="empViewSection" class="emp-view hidden">
      <h3 id="empViewTitle">📅 המשמרות שלי השבוע</h3>
      <div id="empWeekGrid" class="emp-week-grid"></div>
    </div>

    <!-- Admin bar -->
    <div id="adminBar" class="admin-bar hidden">
      <span class="admin-bar-title">🛠 ניהול</span>
      <button class="btn btn-yellow btn-sm" onclick="openEmpModal()">👤 עובדים</button>
      <button class="btn btn-ghost btn-sm" onclick="openTasksModal()">📝 משימות שמורות</button>
      <div style="flex:1"></div>
      <div class="backup-bar">
        <button class="btn btn-ghost btn-sm" onclick="doBackup()">💾 גיבוי JSON</button>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer">
          ♻️ שחזור
          <input type="file" accept=".json" onchange="doRestore(event)" style="display:none"/>
        </label>
      </div>
    </div>

    <!-- Stats -->
    <div id="statsRow" class="stats-row hidden">
      <div class="stat-card">
        <div class="stat-num" id="statWorkers">—</div>
        <div class="stat-label">עובדים השבוע</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statVacations">—</div>
        <div class="stat-label">חופשות</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statTasks">—</div>
        <div class="stat-label">משימות מוגדרות</div>
      </div>
    </div>

    <!-- Week nav -->
    <div class="week-nav">
      <button onclick="shiftWeek(-1)">&#8250;</button>
      <div class="week-label" id="weekLabel">טוען...</div>
      <button onclick="shiftWeek(1)">&#8249;</button>
      <button class="btn-today" onclick="goToday()">השבוע</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="scheduleTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <button id="addRowBtn" class="add-row-btn hidden" onclick="addRow()">+ הוסף שורה</button>
    </div>

  </div>
</div>

<!-- ===== CELL MODAL ===== -->
<div id="cellModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>✏️ עריכת משימה — <span id="cellModalTitle"></span></h3>
    <div class="form-group">
      <label>משימה</label>
      <input type="text" id="cellTask" placeholder="לדוגמה: HMS, שירות, תורן מכס..." list="taskPresets"/>
      <datalist id="taskPresets"></datalist>
      <div class="task-chips" id="taskChips"></div>
    </div>
    <div class="form-group">
      <label>נציג</label>
      <input type="text" id="cellRep" placeholder="שם העובד" list="empPresets"/>
      <datalist id="empPresets"></datalist>
    </div>
    <div class="form-group">
      <label>שעת התחלה</label>
      <select id="cellHour">
        <option value="">— לא מוגדר —</option>
        <option value="8">08:00</option>
        <option value="9">09:00</option>
        <option value="10">10:00</option>
        <option value="11">11:00</option>
        <option value="12">12:00</option>
      </select>
    </div>
    <div class="form-group">
      <label>סוג</label>
      <select id="cellType">
        <option value="task">משימה רגילה</option>
        <option value="vacation">חופש 🌴</option>
        <option value="off">לא עובד / WFH</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" onclick="clearCell()">🗑 נקה</button>
      <button class="btn btn-cancel" onclick="closeCellModal()">ביטול</button>
      <button class="btn btn-yellow" onclick="saveCell()">שמור</button>
    </div>
  </div>
</div>

<!-- ===== EMPLOYEES MODAL ===== -->
<div id="empModal" class="modal-overlay hidden">
  <div class="modal" style="max-width:480px">
    <h3>👥 ניהול עובדים</h3>
    <div class="form-group">
      <label>הוסף עובד</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="newEmpName" placeholder="שם" style="flex:2"/>
        <input type="text" id="newEmpId" placeholder="מספר עובד" style="flex:1;direction:ltr"/>
        <button class="btn btn-yellow btn-sm" onclick="addEmployee()">+</button>
      </div>
    </div>
    <div class="emp-list" id="empList"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeEmpModal()">סגור</button>
    </div>
  </div>
</div>

<!-- ===== TASKS MODAL ===== -->
<div id="tasksModal" class="modal-overlay hidden">
  <div class="modal" style="max-width:480px">
    <h3>📝 משימות שמורות</h3>
    <div class="form-group">
      <label>הוסף משימה</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="newTaskName" placeholder="שם משימה"/>
        <button class="btn btn-yellow btn-sm" onclick="addTask()">+</button>
      </div>
    </div>
    <div class="emp-list" id="taskList"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeTasksModal()">סגור</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDBzV2DN23g7cUMTGND9d9cnmEiOvdKcJ4",
  authDomain: "export-schedule-65c4a.firebaseapp.com",
  databaseURL: "https://export-schedule-65c4a-default-rtdb.firebaseio.com",
  projectId: "export-schedule-65c4a",
  storageBucket: "export-schedule-65c4a.firebasestorage.app",
  messagingSenderId: "1036937110107",
  appId: "1:1036937110107:web:1d4383ec65221fd87dd57e",
  measurementId: "G-XWG8TG9ZZD"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== STATE =====
const ADMIN_PASS = "DHL123";
let currentUser = null; // {role:'admin'|'emp', name:'...'}
let currentWeekOffset = 0;
let scheduleData = {}; // { weekKey: { rowIdx: { dayIdx: {task,rep,hour,type} } } }
let employees = []; // [{name, id}]
let taskPresetsList = [];
let NUM_ROWS = 12;
let editingCell = null; // {rowIdx, dayIdx, weekKey}
let loginMode = 'admin';

// ===== WEEK UTILS =====
function getMondayOfWeek(offset=0) {
  const d = new Date();
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0) ? -6 : 1 - day;
  d.setDate(d.getDate() + diff + offset*7);
  d.setHours(0,0,0,0);
  return d;
}

function getWeekDays(offset=0) {
  const mon = getMondayOfWeek(offset);
  const days = [];
  for (let i=0; i<6; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    days.push(d);
  }
  return days;
}

function weekKey(offset=0) {
  const mon = getMondayOfWeek(offset);
  return `w${mon.getFullYear()}${String(mon.getMonth()+1).padStart(2,'0')}${String(mon.getDate()).padStart(2,'0')}`;
}

function fmtDate(d) {
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
}

function fmtDayName(d) {
  const names = ['ראשון','שני','שלישי','רביעי','חמישי','שישי'];
  return names[d.getDay()];
}

function isToday(d) {
  const t = new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
}

// ===== LOGIN =====
window.setLoginMode = (mode) => {
  loginMode = mode;
  document.getElementById('modeAdminBtn').classList.toggle('active', mode==='admin');
  document.getElementById('modeEmpBtn').classList.toggle('active', mode==='emp');
  document.getElementById('adminLoginForm').classList.toggle('hidden', mode!=='admin');
  document.getElementById('empLoginForm').classList.toggle('hidden', mode!=='emp');
};

window.doLogin = () => {
  const p = document.getElementById('adminPassInput').value;
  if (p === ADMIN_PASS) {
    currentUser = {role:'admin', name:'מנהל'};
    enterApp();
  } else {
    showLoginError('סיסמה שגויה');
  }
};

window.doEmpLogin = () => {
  const name = document.getElementById('empNameInput').value.trim();
  const pass = document.getElementById('empPassInput').value.trim();
  const emp = employees.find(e => e.name === name && e.id === pass);
  if (emp) {
    currentUser = {role:'emp', name: emp.name};
    enterApp();
  } else {
    showLoginError('שם או מספר עובד שגוי');
  }
};

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}

window.doLogout = () => {
  currentUser = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('adminPassInput').value = '';
  document.getElementById('empNameInput').value = '';
  document.getElementById('empPassInput').value = '';
};

function enterApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userBadge').textContent = currentUser.name;
  if (currentUser.role === 'admin') {
    document.getElementById('adminBar').classList.remove('hidden');
    document.getElementById('statsRow').classList.remove('hidden');
    document.getElementById('addRowBtn').classList.remove('hidden');
    document.getElementById('empViewSection').classList.add('hidden');
  } else {
    document.getElementById('adminBar').classList.add('hidden');
    document.getElementById('statsRow').classList.add('hidden');
    document.getElementById('addRowBtn').classList.add('hidden');
    document.getElementById('empViewSection').classList.remove('hidden');
  }
  renderWeek();
}

// ===== FIREBASE =====
function loadData() {
  onValue(ref(db, 'scheduleData'), snap => {
    scheduleData = snap.val() || {};
    renderTable();
    updateStats();
    if (currentUser?.role === 'emp') renderEmpView();
  });
  onValue(ref(db, 'employees'), snap => {
    employees = snap.val() || [];
    refreshEmpDatalist();
    refreshEmpList();
    refreshEmpLoginList();
  });
  onValue(ref(db, 'tasks'), snap => {
    taskPresetsList = snap.val() || [];
    refreshTaskPresets();
    refreshTaskList();
  });
  onValue(ref(db, 'numRows'), snap => {
    if (snap.val()) NUM_ROWS = snap.val();
    renderTable();
  });
}

function saveCell_db(wk, row, day, data) {
  set(ref(db, `scheduleData/${wk}/${row}/${day}`), data);
}
function clearCell_db(wk, row, day) {
  remove(ref(db, `scheduleData/${wk}/${row}/${day}`));
}
function saveEmployees() { set(ref(db, 'employees'), employees); }
function saveTasks() { set(ref(db, 'tasks'), taskPresetsList); }
function saveNumRows(n) { set(ref(db, 'numRows'), n); }

// ===== RENDER WEEK =====
function renderWeek() {
  const days = getWeekDays(currentWeekOffset);
  const wk = weekKey(currentWeekOffset);
  const mon = getMondayOfWeek(currentWeekOffset);
  const sun = new Date(mon); sun.setDate(mon.getDate()+5);
  document.getElementById('weekLabel').textContent =
    `שבוע ${fmtDate(mon)} — ${fmtDate(sun)} · ${mon.getFullYear()}`;
  renderTable();
  updateStats();
  if (currentUser?.role === 'emp') renderEmpView();
}

function renderTable() {
  const days = getWeekDays(currentWeekOffset);
  const wk = weekKey(currentWeekOffset);
  const isAdmin = currentUser?.role === 'admin';

  // Head
  const head = document.getElementById('tableHead');
  head.innerHTML = '<tr>' +
    '<th>#</th>' +
    days.map((d,i) => {
      const cls = isToday(d) ? 'th-today' : '';
      return `<th class="${cls}">${fmtDayName(d)}<div class="th-date">${fmtDate(d)}</div></th>`;
    }).join('') + '</tr>';

  // Body
  const body = document.getElementById('tableBody');
  body.innerHTML = '';
  const wkData = scheduleData[wk] || {};

  for (let row=0; row<NUM_ROWS; row++) {
    const tr = document.createElement('tr');
    const rowData = wkData[row] || {};
    tr.innerHTML = `<td class="row-num">${row+1}</td>`;
    for (let day=0; day<6; day++) {
      const td = document.createElement('td');
      const cell = rowData[day];
      const todayCls = isToday(days[day]) ? ' is-today-col' : '';

      if (!cell || (!cell.task && !cell.rep)) {
        td.innerHTML = `<div class="cell${todayCls}" onclick="${isAdmin?`openCell(${row},${day})`:''}">
          <div class="cell-empty">${isAdmin ? '＋' : '—'}</div></div>`;
      } else {
        let inner = '';
        if (cell.type === 'vacation') {
          inner = `<div class="cell-rep">${cell.rep||''}</div><div class="vacation-badge">חופש 🌴</div>`;
        } else if (cell.type === 'off') {
          inner = `<div class="cell-rep">${cell.rep||''}</div><div style="font-size:11px;color:#aaa">WFH / לא עובד</div>`;
        } else {
          inner = `${cell.task ? `<div class="cell-task">${cell.task}</div>` : ''}
            ${cell.rep ? `<div class="cell-rep">${cell.rep}</div>` : ''}
            ${cell.hour ? `<div class="cell-hour">⏰ ${cell.hour}:00</div>` : ''}`;
        }
        const vcls = cell.type==='vacation' ? ' is-vacation' : cell.type==='off' ? ' is-off' : ' has-data';
        td.innerHTML = `<div class="cell${vcls}${todayCls}" onclick="${isAdmin?`openCell(${row},${day})`:''}">
          ${inner}</div>`;
      }
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

function updateStats() {
  const wk = weekKey(currentWeekOffset);
  const wkData = scheduleData[wk] || {};
  let workers = new Set(), vacations = 0, tasks = 0;
  for (const row of Object.values(wkData)) {
    for (const cell of Object.values(row)) {
      if (cell.rep) workers.add(cell.rep);
      if (cell.type === 'vacation') vacations++;
      if (cell.task) tasks++;
    }
  }
  document.getElementById('statWorkers').textContent = workers.size;
  document.getElementById('statVacations').textContent = vacations;
  document.getElementById('statTasks').textContent = tasks;
}

// ===== EMP VIEW =====
function renderEmpView() {
  const days = getWeekDays(currentWeekOffset);
  const wk = weekKey(currentWeekOffset);
  const wkData = scheduleData[wk] || {};
  const empName = currentUser.name;
  document.getElementById('empViewTitle').textContent = `📅 המשמרות של ${empName} השבוע`;

  const grid = document.getElementById('empWeekGrid');
  grid.innerHTML = '';
  for (let day=0; day<6; day++) {
    let found = null;
    for (const row of Object.values(wkData)) {
      const cell = row[day];
      if (cell && cell.rep === empName) { found = cell; break; }
    }
    const card = document.createElement('div');
    card.className = 'emp-day-card' + (isToday(days[day]) ? ' today' : '');
    let inner = `<div class="emp-day-name">${fmtDayName(days[day])}<br>${fmtDate(days[day])}</div>`;
    if (!found) {
      inner += `<div class="emp-day-off" style="color:#555">—</div>`;
    } else if (found.type === 'vacation') {
      inner += `<div class="emp-day-off">חופש 🌴</div>`;
    } else if (found.type === 'off') {
      inner += `<div class="emp-day-off" style="color:#aaa">WFH</div>`;
    } else {
      inner += `<div class="emp-day-task">${found.task||''}</div>`;
      if (found.hour) inner += `<div class="emp-day-hour">⏰ ${found.hour}:00</div>`;
    }
    card.innerHTML = inner;
    grid.appendChild(card);
  }
}

// ===== WEEK NAV =====
window.shiftWeek = (d) => { currentWeekOffset += d; renderWeek(); };
window.goToday = () => { currentWeekOffset = 0; renderWeek(); };

// ===== ADD ROW =====
window.addRow = () => {
  NUM_ROWS++;
  saveNumRows(NUM_ROWS);
  renderTable();
  showToast('שורה נוספה ✅', 'success');
};

// ===== CELL MODAL =====
window.openCell = (row, day) => {
  const wk = weekKey(currentWeekOffset);
  const days = getWeekDays(currentWeekOffset);
  editingCell = {row, day, wk};
  const existing = scheduleData[wk]?.[row]?.[day] || {};
  document.getElementById('cellModalTitle').textContent =
    `${fmtDayName(days[day])} ${fmtDate(days[day])} · שורה ${row+1}`;
  document.getElementById('cellTask').value = existing.task || '';
  document.getElementById('cellRep').value = existing.rep || '';
  document.getElementById('cellHour').value = existing.hour || '';
  document.getElementById('cellType').value = existing.type || 'task';
  document.getElementById('cellModal').classList.remove('hidden');
};

window.closeCellModal = () => {
  document.getElementById('cellModal').classList.add('hidden');
  editingCell = null;
};

window.saveCell = () => {
  if (!editingCell) return;
  const {row, day, wk} = editingCell;
  const data = {
    task: document.getElementById('cellTask').value.trim(),
    rep: document.getElementById('cellRep').value.trim(),
    hour: document.getElementById('cellHour').value,
    type: document.getElementById('cellType').value
  };
  saveCell_db(wk, row, day, data);
  closeCellModal();
  showToast('נשמר ✅', 'success');
};

window.clearCell = () => {
  if (!editingCell) return;
  const {row, day, wk} = editingCell;
  clearCell_db(wk, row, day);
  closeCellModal();
  showToast('נמחק 🗑', 'success');
};

// ===== TASK CHIPS =====
window.pickTask = (t) => {
  document.getElementById('cellTask').value = t;
};

// ===== EMPLOYEES =====
window.openEmpModal = () => { refreshEmpList(); document.getElementById('empModal').classList.remove('hidden'); };
window.closeEmpModal = () => document.getElementById('empModal').classList.add('hidden');

window.addEmployee = () => {
  const name = document.getElementById('newEmpName').value.trim();
  const id = document.getElementById('newEmpId').value.trim();
  if (!name || !id) return;
  if (employees.find(e => e.name === name)) { showToast('עובד כבר קיים', 'error'); return; }
  employees.push({name, id});
  saveEmployees();
  document.getElementById('newEmpName').value = '';
  document.getElementById('newEmpId').value = '';
};

window.removeEmployee = (i) => {
  if (!confirm(`למחוק את ${employees[i].name}?`)) return;
  employees.splice(i, 1);
  saveEmployees();
};

function refreshEmpList() {
  const el = document.getElementById('empList');
  if (!el) return;
  el.innerHTML = employees.map((e,i) =>
    `<div class="emp-tag">${e.name} <span style="color:var(--muted);font-size:11px">${e.id}</span>
    <button onclick="removeEmployee(${i})">×</button></div>`
  ).join('');
}

function refreshEmpDatalist() {
  const dl = document.getElementById('empPresets');
  if (dl) dl.innerHTML = employees.map(e => `<option value="${e.name}"/>`).join('');
}

function refreshEmpLoginList() {
  const dl = document.getElementById('empNamesList');
  if (dl) dl.innerHTML = employees.map(e => `<option value="${e.name}"/>`).join('');
}

// ===== TASKS =====
window.openTasksModal = () => { refreshTaskList(); document.getElementById('tasksModal').classList.remove('hidden'); };
window.closeTasksModal = () => document.getElementById('tasksModal').classList.add('hidden');

window.addTask = () => {
  const t = document.getElementById('newTaskName').value.trim();
  if (!t) return;
  if (!taskPresetsList.includes(t)) { taskPresetsList.push(t); saveTasks(); }
  document.getElementById('newTaskName').value = '';
};

window.removeTask = (i) => {
  taskPresetsList.splice(i, 1);
  saveTasks();
};

function refreshTaskPresets() {
  const dl = document.getElementById('taskPresets');
  if (dl) dl.innerHTML = taskPresetsList.map(t => `<option value="${t}"/>`).join('');
  const chips = document.getElementById('taskChips');
  if (chips) chips.innerHTML = taskPresetsList.map(t =>
    `<div class="task-chip" onclick="pickTask('${t.replace(/'/g,"\\'")}'">${t}</div>`
  ).join('');
}

function refreshTaskList() {
  const el = document.getElementById('taskList');
  if (!el) return;
  el.innerHTML = taskPresetsList.map((t,i) =>
    `<div class="emp-tag">${t} <button onclick="removeTask(${i})">×</button></div>`
  ).join('');
}

// ===== BACKUP / RESTORE =====
window.doBackup = () => {
  const data = { scheduleData, employees, tasks: taskPresetsList, numRows: NUM_ROWS };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `export-schedule-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  showToast('גיבוי הורד ✅', 'success');
};

window.doRestore = (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('לשחזר נתונים? הנתונים הנוכחיים יוחלפו.')) return;
      if (data.scheduleData) set(ref(db, 'scheduleData'), data.scheduleData);
      if (data.employees) set(ref(db, 'employees'), data.employees);
      if (data.tasks) set(ref(db, 'tasks'), data.tasks);
      if (data.numRows) set(ref(db, 'numRows'), data.numRows);
      showToast('שוחזר בהצלחה ✅', 'success');
    } catch { showToast('קובץ לא תקין ❌', 'error'); }
  };
  reader.readAsText(file);
};

// ===== TOAST =====
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INIT =====
// Pre-load default tasks
async function init() {
  loadData();
  // Add default tasks if none
  const snap = await get(ref(db, 'tasks'));
  if (!snap.val()) {
    const defaults = ['HMS','תביעות','שירות','שטעונים','DCVS','הקלדות','תורן מכס','תיקונים','מיילים','סגירות טיסה','סבב','בית'];
    set(ref(db, 'tasks'), defaults);
  }
}
init();

</script>
</body>
